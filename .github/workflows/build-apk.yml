name: Build Vedic Library APK - Fixed

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fix Project Structure
      run: |
        echo "Fixing project structure..."
        mkdir -p app/src/main/java/com/archiveapp/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/mipmap-mdpi
        mkdir -p app/src/main/res/mipmap-xhdpi
        mkdir -p app/src/main/res/mipmap-xxhdpi
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p gradle/wrapper
        
        # Move files to correct locations if they exist at root
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
        [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/archiveapp/app/ || true
        [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/ || true
        [ -f colors.xml ] && mv colors.xml app/src/main/res/values/ || true
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/ || true
        [ -f themes.xml ] && mv themes.xml app/src/main/res/values/ || true
        [ -f file_paths.xml ] && mv file_paths.xml app/src/main/res/xml/ || true
        
        # Handle icons
        [ -f ic_launcher.png ] && cp ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png || true
        [ -f ic_launcher_round.png ] && cp ic_launcher_round.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png || true
        [ -f app-icon.png ] && cp app-icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png || true
        [ -f vedic-app-icon.png ] && cp vedic-app-icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png || true
        [ -f vedic-app-icon.png ] && cp vedic-app-icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png || true
        
        # Copy icons to all densities
        for d in app/src/main/res/mipmap-*; do
          [ -f app/src/main/res/mipmap-hdpi/ic_launcher.png ] && cp app/src/main/res/mipmap-hdpi/ic_launcher.png $d/ || true
          [ -f app/src/main/res/mipmap-hdpi/ic_launcher_round.png ] && cp app/src/main/res/mipmap-hdpi/ic_launcher_round.png $d/ic_launcher_round.png || true
        done
        
        # If build.gradle at root is actually app build.gradle, move it
        if [ -f build.gradle ] && grep -q "namespace" build.gradle; then
          echo "Moving app build.gradle to correct location"
          cp build.gradle app/build.gradle || true
        fi
        
        # Create root build.gradle if missing or wrong
        cat > build.gradle << 'EOF'
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.10' apply false
        }
        EOF
        
        # Create settings.gradle if missing
        if [ ! -f settings.gradle ]; then
          cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Vedic Library"
        include ':app'
        EOF
        fi
        
        # Create gradle.properties if missing
        if [ ! -f gradle.properties ]; then
          cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRResources=true
        EOF
        fi
        
        # Create file_paths.xml if missing
        if [ ! -f app/src/main/res/xml/file_paths.xml ]; then
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <paths>
            <external-path name="external_files" path="." />
            <external-files-path name="external_files" path="." />
            <cache-path name="cache" path="." />
            <external-cache-path name="external_cache" path="." />
            <files-path name="files" path="." />
        </paths>
        EOF
        fi
        
        # Download gradle wrapper jar if missing
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
        fi
        
        # Create wrapper properties if missing
        if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        fi
        
        # Fix MainActivity.kt URL if needed
        if [ -f app/src/main/java/com/archiveapp/app/MainActivity.kt ]; then
          sed -i 's|@your_username|@vivek_arya_vedic_lib|g' app/src/main/java/com/archiveapp/app/MainActivity.kt || true
          sed -i 's|@vivek_arya_vedic_lib.*|@vivek_arya_vedic_lib"|g' app/src/main/java/com/archiveapp/app/MainActivity.kt || true
        fi
        
        echo "Structure fixed, listing files:"
        find app -type f | head -20
        ls -la gradle/wrapper/

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Vedic-Library-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
