 name: Build Vedic Library APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Create Project
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/vedic/library
          mkdir -p app/src/main/res/values
          
          echo "include ':app'" > settings.gradle
          
          echo "plugins { id 'com.android.application' version '8.2.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }" > build.gradle
          
          echo "org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle << 'ENDOFFILE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.vedic.library'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vedic.library"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ENDOFFILE

          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Vedic Library">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDOFFILE

          cat > app/src/main/java/com/vedic/library/MainActivity.kt << 'ENDOFFILE'
          package com.vedic.library
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val wv = WebView(this)
                  setContentView(wv)
                  wv.settings.javaScriptEnabled = true
                  wv.webViewClient = WebViewClient()
                  wv.loadUrl("https://archive.org/details/@vivek_arya_vedic_lib")
              }
          }
          ENDOFFILE

          echo '<resources><string name="app_name">Vedic Library</string></resources>' > app/src/main/res/values/strings.xml
          
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ls -lh gradle/wrapper/

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vedic-Library-APK
          path: app/build/outputs/apk/debug/app-debug.apk
